name: Release (3DS)

# Builds everything a player needs without a compiler:
#   * gdx-extract, the PC-side asset extractor tools/prebake drives, for Windows, macOS and Linux;
#   * the console artifacts (.3dsx, .cia, .elf) from a clean checkout via tools/ci-3ds.sh.
# On a tag push (v*) or a manual run with a tag, the files are attached to that GitHub Release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the artifacts to (blank = artifacts only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  extractor:
    name: gdx-extract (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, name: windows-x64,   exe: gdx-extract.exe }
          - { os: macos-14,     name: macos-universal, exe: gdx-extract, extra: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0' }
          - { os: ubuntu-22.04, name: linux-x64,     exe: gdx-extract }
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Torch submodule only
        run: git submodule update --init --depth 1 torch
      - name: Configure
        run: >
          cmake -S torch -B build-extract
          -DUSE_STANDALONE=ON -DBUILD_STORMLIB=OFF -DGDX_DETERMINISTIC=ON
          -DGDX_OUTPUT_NAME=gdx-extract -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_DEFAULT_CMP0091=NEW ${{ matrix.extra }}
      - name: Build
        run: cmake --build build-extract --config Release --parallel 4
      - name: Install
        run: cmake --install build-extract --config Release --prefix build-extract/install
      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p pkg
          cp "build-extract/install/bin/${{ matrix.exe }}" pkg/
          if command -v lipo >/dev/null; then lipo -info "pkg/${{ matrix.exe }}"; fi
          cat > pkg/README.txt <<'TXT'
          gdx-extract: the PC-side asset extractor for the G-Diffuser 3DS port.
          Use it with tools/prebake/prebake.py from the repository:
            python3 tools/prebake/prebake.py --rom <your F-Zero X US rev0 .z64> --extractor <path to this binary>
          It reads your own cartridge dump and writes fzerox.o2r / gdiffuser.o2r under dist/sdmc/.
          No game data is included here.
          TXT
          cd pkg && (command -v zip >/dev/null && zip -q -r "../gdx-extract-${{ matrix.name }}.zip" . || 7z a -bd "../gdx-extract-${{ matrix.name }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: gdx-extract-${{ matrix.name }}
          path: gdx-extract-${{ matrix.name }}.zip
          if-no-files-found: error

  console:
    name: 3DS build
    runs-on: ubuntu-24.04
    steps:
      - name: devkitPro (3ds-dev) and host packages
        run: |
          set -e
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake build-essential python3 python3-yaml python3-pil curl unzip >/dev/null
          curl -sSL -o install-devkitpro-pacman https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x install-devkitpro-pacman && sudo ./install-devkitpro-pacman >/dev/null
          sudo dkp-pacman -S --noconfirm --needed 3ds-dev >/dev/null
          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> "$GITHUB_ENV"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
          cmake --version | head -1; ls /opt/devkitpro/cmake/3DS.cmake
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: makerom + bannertool
        run: |
          set -e
          mkdir -p tools/3ds-bin && cd tools/3ds-bin
          curl -sSL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          unzip -o -q makerom.zip && rm makerom.zip
          curl -sSL -o bannertool.tar.gz https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3-linux.tar.gz
          tar xzf bannertool.tar.gz && rm bannertool.tar.gz
          find . -mindepth 2 -type f \( -name makerom -o -name bannertool \) -exec mv -f {} . \;
          chmod +x makerom bannertool && ls -la
          ./makerom -help >/dev/null 2>&1 || true; ./bannertool >/dev/null 2>&1 || true
      - name: Patches, host tests, 3DS build
        run: tools/ci-3ds.sh --jobs 4
      - name: .cia
        run: |
          export PATH="$PWD/tools/3ds-bin:$PATH"
          cmake -S . -B build-3ds -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/3DS.cmake -DGDX_PLATFORM_3DS=ON -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build-3ds --target G-Diffuser-3DS-cia --parallel 4
      - name: Collect
        run: |
          mkdir -p out
          cp build-3ds/port/3ds/G-Diffuser-3DS.3dsx build-3ds/port/3ds/G-Diffuser-3DS.cia build-3ds/port/3ds/G-Diffuser-3DS.elf out/
          cd out && sha256sum G-Diffuser-3DS.3dsx G-Diffuser-3DS.cia G-Diffuser-3DS.elf > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: G-Diffuser-3DS
          path: out/*
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: [extractor, console]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"
          ls -R artifacts
          gh release upload "$TAG" artifacts/gdx-extract-*/gdx-extract-*.zip --clobber -R "${GITHUB_REPOSITORY}"
          for f in artifacts/G-Diffuser-3DS/*; do
            name=$(basename "$f")
            if gh release view "$TAG" -R "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -qx "$name"; then
              echo "keep existing $name"
            else
              gh release upload "$TAG" "$f" -R "${GITHUB_REPOSITORY}"
            fi
          done
