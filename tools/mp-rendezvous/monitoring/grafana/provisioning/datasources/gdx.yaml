apiVersion: 1
datasources:
  - name: Prometheus
    uid: gdx-prom
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
  - name: Loki
    uid: gdx-loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    jsonData:
      maxLines: 1000
