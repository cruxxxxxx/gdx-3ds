<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottom Screen Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f4f6; --panel: #ffffff; --ink: #1d1d22; --muted: #6b6b78; --line: #dcdce3;
  --accent: #e0362c; --accent-ink: #ffffff; --sel: #1f7aff; --pin: #ffb400; --pin-ink: #1d1d22;
  --chip: #eeeef3; --danger: #c62828;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15151a; --panel: #1e1e25; --ink: #ececf1; --muted: #9a9aa8; --line: #33333d;
    --chip: #2a2a33; --sel: #4b95ff;
  }
}
:root[data-theme="dark"] {
  --bg: #15151a; --panel: #1e1e25; --ink: #ececf1; --muted: #9a9aa8; --line: #33333d;
  --chip: #2a2a33; --sel: #4b95ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
header {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel);
}
header h1 { font-size: 14px; margin: 0 12px 0 0; }
header .spacer { flex: 1; }
button, select, input, textarea {
  font: inherit; color: inherit; background: var(--chip); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px;
}
button { cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.on { background: var(--sel); color: #fff; border-color: var(--sel); }
button.danger { color: var(--danger); }
main { display: grid; grid-template-columns: 220px 1fr 300px; min-height: 0; }
aside { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 10px; }
aside.right { border-right: 0; border-left: 1px solid var(--line); }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
aside h2:first-child { margin-top: 0; }
.list { display: flex; flex-direction: column; gap: 2px; }
.list .item {
  padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px;
}
.list .item:hover { background: var(--chip); }
.list .item.active { background: var(--sel); color: #fff; }
.list .item .badge { font-size: 11px; opacity: .8; }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.palette button { flex: 1 1 45%; }
.field { display: grid; grid-template-columns: 70px 1fr; gap: 6px; align-items: center; margin: 5px 0; }
.field label { color: var(--muted); font-size: 12px; }
.field input, .field select, .field textarea { width: 100%; }
.field textarea { min-height: 54px; resize: vertical; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.grid4 input { width: 100%; padding: 4px; }
.hint { color: var(--muted); font-size: 12px; }
#stageWrap { overflow: auto; display: flex; align-items: flex-start; justify-content: safe center; padding: 24px; min-width: 0; }
#stageCol { display: flex; flex-direction: column; gap: 10px; align-items: center; }
#screenTitle { font-weight: 600; }
#device {
  padding: 14px; background: #2b2b31; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.25);
}
#stage {
  position: relative; width: 320px; height: 240px; background: #000; overflow: hidden;
  transform-origin: 0 0; image-rendering: pixelated; cursor: default;
}
#stageScaler { position: relative; }
#stage.notes-mode { cursor: crosshair; }
#stage .bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
#stage .gridlay {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.08) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.08) 1px, transparent 1px);
  background-size: 8px 8px;
}
.el {
  position: absolute; font-family: "Press Start 2P", ui-monospace, monospace; font-size: 8px; line-height: 8px;
  white-space: pre; overflow: hidden; user-select: none;
}
.el.button { display: flex; align-items: center; justify-content: center; border: 1px solid currentColor; }
.el.tab { display: flex; align-items: center; justify-content: flex-start; }
.el.box { border: 1px solid currentColor; }
.el.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: currentColor; }
.el.icon { border: 1px dashed currentColor; display: flex; align-items: center; justify-content: center; }
.el.touch { outline: 1px dotted rgba(0, 200, 255, .55); outline-offset: -1px; }
.el.sel { outline: 1px solid var(--sel) !important; outline-offset: 0; z-index: 50; }
.el .handle {
  position: absolute; right: 0; bottom: 0; width: 5px; height: 5px; background: var(--sel); cursor: nwse-resize;
}
.ghost .el { opacity: .35; pointer-events: none; outline: 1px dashed #ff4fd8 !important; }
.ghost { position: absolute; inset: 0; pointer-events: none; }
.pin {
  position: absolute; width: 9px; height: 9px; margin: -4px 0 0 -4px; border-radius: 50%;
  background: var(--pin); border: 1px solid #000; z-index: 80; cursor: pointer;
}
.pin span {
  position: absolute; left: 8px; top: -6px; font: 600 7px/1 sans-serif; color: #000; background: var(--pin);
  padding: 1px 2px; border-radius: 3px;
}
.pin.done { background: #48c774; }
.pin.done span { background: #48c774; }
.pin.sel { box-shadow: 0 0 0 2px var(--sel); }
.statusbar { color: var(--muted); font-size: 12px; text-align: center; min-height: 18px; }
.pinlist .p { border: 1px solid var(--line); border-radius: 8px; padding: 6px; margin-bottom: 6px; cursor: pointer; }
.pinlist .p.active { border-color: var(--sel); }
.pinlist .p b { color: var(--accent); }
.toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: .95; }
kbd { background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; }
@media (max-width: 900px) {
  body { overflow: auto; }
  main { grid-template-columns: 1fr; }
  aside { border: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <h1>Bottom Screen Designer</h1>
  <button id="btnSelectMode" class="on" title="Select / move (V)">Select</button>
  <button id="btnNoteMode" title="Click the screen to drop a note pin (N)">Add note</button>
  <span class="hint">|</span>
  <label class="hint">Zoom <select id="zoom"><option value="fit" selected>fit</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
  <button id="btnGrid" class="on" title="8px console grid">Grid</button>
  <button id="btnSnap" class="on" title="Snap to 8px cells">Snap 8</button>
  <button id="btnGhost" title="Overlay the current in-game layout">Show original</button>
  <button id="btnTouch" class="on" title="Outline tappable things">Show taps</button>
  <button id="btnUndo" title="Undo (Cmd/Ctrl+Z)">Undo</button>
  <span class="spacer"></span>
  <button id="btnImport">Open…</button>
  <input id="fileImport" type="file" accept=".json,application/json" hidden>
  <button id="btnPng">PNG of screen</button>
  <button id="btnReset" class="danger" title="Throw away edits and reload the in-game layout">Reset</button>
  <button id="btnExport" class="primary">Save for Claude</button>
</header>
<main>
  <aside>
    <h2>Screens</h2>
    <div id="screenList" class="list"></div>
    <div class="row">
      <button id="btnAddScreen">+ New</button>
      <button id="btnDupScreen">Duplicate</button>
      <button id="btnDelScreen" class="danger">Delete</button>
    </div>
    <h2>Add element</h2>
    <div class="row palette">
      <button data-add="text">Text</button>
      <button data-add="button">Button</button>
      <button data-add="tab">Tab</button>
      <button data-add="box">Box</button>
      <button data-add="bar">Bar / gauge</button>
      <button data-add="icon">Icon / image</button>
    </div>
    <h2>Background</h2>
    <div class="row">
      <button id="btnBg">Image…</button>
      <button id="btnBgClear">Clear</button>
      <input id="fileBg" type="file" accept="image/*" hidden>
    </div>
    <div class="hint">Optional: drop a photo/screenshot (320×240) to trace over.</div>
    <h2>Keys</h2>
    <div class="hint">
      <kbd>V</kbd> select · <kbd>N</kbd> note<br>
      <kbd>←↑→↓</kbd> nudge 1px, <kbd>Shift</kbd> 8px<br>
      <kbd>Alt</kbd>+arrows resize<br>
      <kbd>⌘D</kbd> duplicate · <kbd>Del</kbd> delete<br>
      <kbd>⌘Z</kbd> undo · <kbd>Esc</kbd> deselect
    </div>
  </aside>
  <section id="stageWrap">
    <div id="stageCol">
      <div id="screenTitle"></div>
      <div id="device"><div id="stageScaler"><div id="stage"></div></div></div>
      <div class="statusbar" id="statusbar"></div>
    </div>
  </section>
  <aside class="right" id="props"></aside>
</main>
<div class="toast" id="toast"></div>
