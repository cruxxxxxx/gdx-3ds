"}]},{"id":"menu-race-visible","name":"MENU \u00b7 tab bar with RACE visible (mid-race, dismissed)","notes":"Tab-bar-only variant: shown instead of the normal tab bar whenever [debug] bottom_race=1, a race is live, and the DASH takeover has been dismissed back to the debug tabs. Tapping RACE (or a 1.5s KEY_SELECT hold anywhere in the menu) resumes the DASH HUD on the very next tick.","elements":[{"id":"fps-row","type":"text","x":0,"y":0,"w":320,"h":8,"text":"drawn 58.2 game 59.9 off","fg":"#FFFFFF","bg":null,"touch":false,"action":null,"source":"gdx3ds_menu.c:150 sFpsLine / gdx3ds_menu.c:158 FormatFpsRow (\"%s%sdrawn %lu.%lu game %lu.%lu %s\") / painted by PaintAll at gdx3ds_menu.c:546","notes":"Row 1, always drawn (blank string if [debug] fps HUD row is disabled via DBG tab). Tag prefix (launch variant / NRR bisect tag) omitted here; frameskip mode word at the end is one of off/auto/steady."},{"id":"tab-sta","type":"tab","x":0,"y":8,"w":24,"h":8,"text":"STA","fg":"#000000","bg":"#FFFFFF","touch":true,"action":"switch MENU to the STA tab","source":"gdx3ds_menu.c:107-109 kTabLabels, gdx3ds_menu_tabbar_layout.h:36-56 gdx3ds_menu_layout_tabs, gdx3ds_menu.c:261-272 PaintTabBar / touch: gdx3ds_menu.c:661-683 TouchTabBar","notes":"Reverse-video (white bg, black text) while this is the open tab."},{"id":"tab-dsp","type":"tab","x":32,"y":8,"w":24,"h":8,"text":"DSP","fg":"#FFFFFF","bg":null,"touch":true,"action":"switch MENU to the DSP tab","source":"gdx3ds_menu.c:107-109 kTabLabels, gdx3ds_menu_tabbar_layout.h:36-56 gdx3ds_menu_layout_tabs, gdx3ds_menu.c:261-272 PaintTabBar / touch: gdx3ds_menu.c:661-683 TouchTabBar","notes":null},{"id":"tab-3d","type":"tab","x":64,"y":8,"w":16,"h":8,"text":"3D","fg":"#FFFFFF","bg":null,"touch":true,"action":"switch MENU to the 3D tab","source":"gdx3ds_menu.c:107-109 kTabLabels, gdx3ds_menu_tabbar_layout.h:36-56 gdx3ds_menu_layout_tabs, gdx3ds_menu.c:261-272 PaintTabBar / touch: gdx3ds_menu.c:661-683 TouchTabBar","notes":null},{"id":"tab-aud","type":"tab","x":88,"y":8,"w":24,"h":8,"text":"AUD","fg":"#FFFFFF","bg":null,"touch":true,"action":"switch MENU to the AUD tab","source":"gdx3ds_menu.c:107-109 kTabLabels, gdx3ds_menu_tabbar_layout.h:36-56 gdx3ds_menu_layout_tabs, gdx3ds_menu.c:261-272 PaintTabBar / touch: gdx3ds_menu.c:661-683 TouchTabBar","notes":null},{"id":"tab-in","type":"tab","x":120,"y":8,"w":16,"h":8,"text":"IN","fg":"#FFFFFF","bg":null,"touch":true,"action":"switch MENU to the IN tab","source":"gdx3ds_menu.c:107-109 kTabLabels, gdx3ds_menu_tabbar_layout.h:36-56 gdx3ds_menu_layout_tabs, gdx3ds_menu.c:261-272 PaintTabBar / touch: gdx3ds_menu.c:661-683 TouchTabBar","notes":null},{"id":"tab-lg","type":"tab","x":144,"y":8,"w":16,"h":8,"text":"LG","fg":"#FFFFFF","bg":null,"touch":true,"action":"switch MENU to the LG tab","source":"gdx3ds_menu.c:107-109 kTabLabels, gdx3ds_menu_tabbar_layout.h:36-56 gdx3ds_menu_layout_tabs, gdx3ds_menu.c:261-272 PaintTabBar / touch: gdx3ds_menu.c:661-683 TouchTabBar","notes":null},{"id":"tab-dbg","type":"tab","x":168,"y":8,"w":24,"h":8,"text":"DBG","fg":"#FFFFFF","bg":null,"touch":true,"action":"switch MENU to the DBG tab","source":"gdx3ds_menu.c:107-109 kTabLabels, gdx3ds_menu_tabbar_layout.h:36-56 gdx3ds_menu_layout_tabs, gdx3ds_menu.c:261-272 PaintTabBar / touch: gdx3ds_menu.c:661-683 TouchTabBar","notes":null},{"id":"tab-race","type":"tab","x":200,"y":8,"w":32,"h":8,"text":"RACE","fg":"#FFFFFF","bg":null,"touch":true,"action":"resume whichever full-screen takeover is actually dismissed right now: the race DASH (gdx3ds_bottomhud_resume()) if a race is live, else the idle view (gdx3ds_bottomhud_idle_resume())","source":"gdx3ds_menu.c:107-109 kTabLabels, gdx3ds_menu_tabbar_layout.h:36-56 gdx3ds_menu_layout_tabs, gdx3ds_menu.c:261-272 PaintTabBar / touch: gdx3ds_menu.c:661-683 TouchTabBar","notes":"Painted \"RACE\" (this screen's own case: mid-race, DASH dismissed) or \"DASH\" (idle-view round: outside a race, idle view dismissed) -- MenuTabRaceLabel picks the text, gdx3ds_bottomhud_race_live() is the discriminant. Both strings are 4 characters, so the column width computed from kTabLabels[TAB_RACE]==\"RACE\" stays correct either way."},{"id":"tab-ab","type":"tab","x":240,"y":8,"w":16,"h":8,"text":"AB","fg":"#FFFFFF","bg":null,"touch":true,"action":"switch MENU to the AB tab","source":"gdx3ds_menu.c:107-109 kTabLabels, gdx3ds_menu_tabbar_layout.h:36-56 gdx3ds_menu_layout_tabs, gdx3ds_menu.c:261-272 PaintTabBar / touch: gdx3ds_menu.c:661-683 TouchTabBar","notes":null},{"id":"off-button-label","type":"button","x":264,"y":8,"w":40,"h":8,"text":"[OFF]","fg":"#FFFFFF","bg":null,"touch":true,"action":"sleep the bottom screen (screen-off; backlight off); touch wakes it again","source":"gdx3ds_menu.c:273-279 PaintTabBar (\"[OFF]\" normal, or reverse-video \"OFF\" when the bar is too full) / touch: gdx3ds_menu.c:657-660 TouchTabBar -> MenuEnterOff(1)","notes":"Drawn text is only the label glyphs; the actual touch hit box is wider (col>=sOffC0) \u2014 see off-button-hitbox."},{"id":"off-button-hitbox","type":"box","x":264,"y":8,"w":56,"h":8,"text":null,"fg":null,"bg":null,"touch":true,"action":"same as off-button-label (the hit box is col >= sOffC0, up to col 40)","source":"gdx3ds_menu.c:113-114 sOffC0/sOffC1, gdx3ds_menu.c:656-660 TouchTabBar","notes":"Invisible: no glyphs are drawn over these extra columns, but a tap anywhere in them still triggers OFF."},{"id":"race-visible-info","type":"text","x":0,"y":24,"w":320,"h":8,"text":"(whichever tab's page was open stays open below)","fg":"#FFFFFF","bg":null,"touch":false,"action":null,"source":"gdx3ds_menu.c:1121-1173 gdx3ds_menu_tick_body (DASH-dismissed handling) / TAB_RACE comment at gdx3ds_menu.c:77-86,116-118","notes":"This screen only differs from the other menu-* screens in its TAB BAR: RACE becomes a visible, tappable label once the DASH's own on-screen MENU button (or a KEY_SELECT long-press) dismisses the race takeover mid-race. Whatever ordinary tab (STA/DSP/3D/...) was open keeps rendering underneath unchanged; sTab is not reset. Assumes [debug] bottom_map=0 here -- if MAP is ALSO shown, RACE's columns shift right by 4 (to col 30-33) and AB/OFF shift further, with OFF's hit box then starting at col 38 and (since 38+5-1=42 > 40) rendering reverse-video 'OFF' (3 letters) instead of '[OFF]'."}]},{"id":"dash","name":"DASH race HUD (full-screen takeover)","notes":"Only ever shown when [debug] bottom_race=1 AND a race is currently live AND it hasn't been dismissed; outside a live race the bottom screen instead shows the 'idle' screen's polished checkerboard+logo view (idle-view round), or, with [debug] bottom_idle=0 or bottom_race=0, the ordinary MENU tabs (see menu-race-visible). Placement swap note: the header band sits at y=218 (bottom) and the energy bar at y=0 (top) after a coordinator fix reversed their original positions. Hardware feedback round (8 numbered on-device notes): geometry is now sourced from a single sDashWidgets[] data table (id/x/y/w/h/enabled/paint-fn) in gdx3ds_bottomhud.c instead of scattered #define rects -- groundwork for a later on-device draggable/resizable/hideable custom-HUD mode. Every widget below cites its id in that table.","elements":[{"id":"dash-background","type":"box","x":0,"y":0,"w":320,"h":240,"text":null,"fg":"#7A5566","bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c:430-447 DashDimBackground, :666-672 DashPaintBaked, gdx3ds_hudbake.h gDashAssetBackground","notes":"UNCERTAIN exact colour: this is a baked pink checker-pattern texture (gDashAssetBackground, 320x240 RGB565), darkened ~35% and desaturated ~20% toward its own luma by DashDimBackground at bake time. #7A5566 is a rough average guess, not a decoded pixel value. Painted once per race (sWasValid 0->1 edge), not every tick."},{"id":"dash-header-panel","type":"box","x":0,"y":218,"w":320,"h":22,"text":null,"fg":null,"bg":null,"touch":false,"action":null,"source":"sDashWidgets['header'] (DASHW_HEADER), gdx3ds_hudbake.h kDashAssetWidgets['header'], gdx3ds_bottomhud.c:DashPaintHeaderLive","notes":"Baked backdrop (flat panel + chrome) with two live text zones cut into it via DashBakeSkipCell: col<150 (course name) and col>=230 (racer count); cols 150-229 stay baked chrome. Both live zones are now painted together, dirty-checked, by a single DashPaintHeaderLive function (hardware feedback round item 5 folded the racer-count fix into the same widget as the pre-existing course-name live text)."},{"id":"dash-course-name","type":"text","x":6,"y":225,"w":150,"h":8,"text":"MUTE CITY I","fg":"#FFFFFF","bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintHeaderLive (Font1 glyphs, num=1 den=2)","notes":"Live, dirty-checked against the track name string: repainted only when it changes (effectively once per race). Real track name, uppercased, e.g. 'MUTE CITY' or 'SECTOR Y'."},{"id":"dash-racer-count","type":"text","x":230,"y":225,"w":84,"h":8,"text":"30 RACERS","fg":"#FFFFFF","bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintHeaderLive (\"%d RACERS\", Font2 best-fit, right-aligned; clears cols 230+ before redraw)","notes":"FIXED (hardware feedback round item 5): was frozen baked art reading whatever count the template export happened to show. Now live, dirty-checked against snap->racersRemaining -- updates as CPU racers retire/get knocked out during the race."},{"id":"dash-mode-chip","type":"button","x":168,"y":221,"w":62,"h":16,"text":"MODE 1","fg":"#FFFFFF","bg":"#3A1029","touch":true,"action":"cycle HUD placement ALL_TOP -> SPLIT -> ALL_BOTTOM -> ALL_TOP (also triggerable with a KEY_SELECT tap)","source":"sDashWidgets['mode_chip'] (DASHW_MODE_CHIP), gdx3ds_bottomhud.c DashPaintModeLabel / DashPaintModeDot / touch handler","notes":"Panel fill #3A1029, border #FF6DB5 (DashStrokeRect, drawn once per race). Label text redrawn live every tick via Font2 glyphs, best-fit 2x or 1x scale. A 6x6 colour dot at the chip's right edge shows the mode: #00FF00 = MODE 1 (ALL_TOP), #FFFF00 = MODE 2 (SPLIT), #FF00FF = MODE 3 (ALL_BOTTOM)."},{"id":"dash-debug-button","type":"button","x":84,"y":221,"w":70,"h":16,"text":"DEBUG","fg":"#FFFFFF","bg":"#3A1029","touch":true,"action":"dismiss the DASH takeover and hand the screen back to the ordinary debug tab UI (the race keeps running; the tab bar's RACE/DASH slot becomes visible to come back)","source":"sDashWidgets['menu_button'] (DASHW_MENU_BUTTON), gdx3ds_bottomhud.c DashPaintBackButton / touch handler","notes":"Same chip styling (#3A1029 fill, #FF6DB5 border) as the MODE chip. A 1.5s (90-tick) KEY_SELECT hold does the same thing without touching this button. Labelled \"MENU\" before the idle-view round; renamed \"DEBUG\" -- a clearer name for a button that opens the text-console debug UI, not a game menu. The SAME button (same rect, same DashPaintBackButton chrome, same label) is also used by the idle view (see the new 'idle' screen) and by CUSTOM mode (see dash-custom-debug-button below)."},{"id":"dash-portrait-box","type":"box","x":0,"y":26,"w":63,"h":42,"text":null,"fg":null,"bg":"#100808","touch":false,"action":null,"source":"sDashWidgets['portrait'] (DASHW_PORTRAIT), gdx3ds_bottomhud.c DashPaintOurPosition","notes":"FIXED (hardware feedback round item 3): width narrowed 64->63px. The old 64px-wide box's right edge (column 63) coincided with the minimap's left border-stroke column, and since this box repaints every tick while the map border only repaints on its own throttle, the portrait fill was winning the race and eating the border pixel -- read as 'a black background overflowing onto the minimap'. Narrowing this box AND (independently, via the item-4 map resize) moving the map box's left edge away from column 63 fixes it belt-and-suspenders."},{"id":"dash-our-position","type":"text","x":2,"y":26,"w":47,"h":42,"text":"4TH","fg":null,"bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintOurPosition (aPosition<N>Tex digit(s) + aPositionOrdinalSuffix<X>Tex)","notes":"Live, every tick: our own race position as a big numeral + ordinal suffix (ST/ND/RD/TH), real game glyph textures. Single digit draws at native scale; two digits (10+) halve to fit. Kept inside the now-63px-wide portrait box (see dash-portrait-box)."},{"id":"dash-standings-box","type":"box","x":0,"y":67,"w":64,"h":148,"text":null,"fg":null,"bg":null,"touch":false,"action":null,"source":"sDashWidgets['standings'] (DASHW_STANDINGS), gdx3ds_bottomhud.c DashPaintStandingsLive","notes":"FIXED (hardware feedback round item 2): was static baked art (frozen example roster, uniform small portraits), 'essentially useless' per the hardware note. Now 5 stacked rows (29px each, DASH_STANDINGS_ROW_H), dirty-checked against the live top-5 roster (Top5Changed): real per-character portrait art (dash-standings-portrait-N), live rank badge (dash-standings-rank-N), and a live colour swatch (dash-standings-swatch-N) all repaint together on the same roster-change edge. Top-2 rows get bigger portraits than rows 3-5, per the hardware note's own framing."},{"id":"dash-standings-rank-0","type":"text","x":29,"y":74,"w":24,"h":16,"text":"1ST","fg":null,"bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintStandingsRanks (aPosition<N>Tex + aPositionOrdinalSuffix<X>Tex, half scale)","notes":"Rank label is fixed by row (1st..5th) -- this is the standings LADDER, not our own position; it never changes. Drawn once per race into the free cols (29-63) of each row."},{"id":"dash-standings-portrait-0","type":"icon","x":0,"y":67,"w":28,"h":28,"text":null,"fg":null,"bg":"#1A1041","touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintStandingsPortraits (kDashGlyphPortrait[snap->top5Character[0]], num=7 den=8 -> 28x28)","notes":"NEW (hardware feedback round item 2): real character portrait texture, baked at boot from the user's own .o2r archive (gdx3ds_hudbake.c kPortraitTexName, matching gCharacterPortraitTextures[] order) and keyed live by whichever racer currently holds this standings row. Top-2 rows (this one and row 1) are drawn bigger (28x28) than rows 2-4 (20x20), per the hardware note's 'top 2 racers have bigger portraits' framing. Cell is flat-filled (#1A1041-ish, 0x1041 RGB565) first so empty rows (fewer than 5 live racers) still read cleanly."},{"id":"dash-standings-swatch-0","type":"icon","x":56,"y":69,"w":6,"h":6,"text":null,"fg":null,"bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashCharacterColour/DashPaintTop5Tags","notes":"Live colour swatch keyed to the character occupying this standings row this tick (one of 8 fixed palette colours), repainted only when the top-5 roster changes. Kept as a supplementary at-a-glance cue now that dash-standings-portrait-0 shows the real portrait -- not replaced."},{"id":"dash-standings-rank-1","type":"text","x":29,"y":103,"w":24,"h":16,"text":"2ND","fg":null,"bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintStandingsRanks (aPosition<N>Tex + aPositionOrdinalSuffix<X>Tex, half scale)","notes":"Rank label is fixed by row (1st..5th); drawn once per race into the free cols (29-63) of each row."},{"id":"dash-standings-portrait-1","type":"icon","x":0,"y":96,"w":28,"h":28,"text":null,"fg":null,"bg":"#1A1041","touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintStandingsPortraits (kDashGlyphPortrait[snap->top5Character[1]], num=7 den=8 -> 28x28)","notes":"Real live character portrait, second of the two big (28x28) top rows. See dash-standings-portrait-0 for the full explanation."},{"id":"dash-standings-swatch-1","type":"icon","x":56,"y":98,"w":6,"h":6,"text":null,"fg":null,"bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashCharacterColour/DashPaintTop5Tags","notes":"Live colour swatch, supplementary to dash-standings-portrait-1. Repainted only when the top-5 roster changes."},{"id":"dash-standings-rank-2","type":"text","x":29,"y":132,"w":24,"h":16,"text":"3RD","fg":null,"bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintStandingsRanks (aPosition<N>Tex + aPositionOrdinalSuffix<X>Tex, half scale)","notes":"Rank label is fixed by row (1st..5th); drawn once per race into the free cols (29-63) of each row."},{"id":"dash-standings-portrait-2","type":"icon","x":4,"y":129,"w":20,"h":20,"text":null,"fg":null,"bg":"#1A1041","touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintStandingsPortraits (kDashGlyphPortrait[snap->top5Character[2]], num=5 den=8 -> 20x20)","notes":"Real live character portrait, first of the three small (20x20) rows (rows 3-5 per the hardware note's framing). See dash-standings-portrait-0 for the full explanation."},{"id":"dash-standings-swatch-2","type":"icon","x":56,"y":127,"w":6,"h":6,"text":null,"fg":null,"bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashCharacterColour/DashPaintTop5Tags","notes":"Live colour swatch, supplementary to dash-standings-portrait-2. Repainted only when the top-5 roster changes."},{"id":"dash-standings-rank-3","type":"text","x":29,"y":161,"w":24,"h":16,"text":"4TH","fg":null,"bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintStandingsRanks (aPosition<N>Tex + aPositionOrdinalSuffix<X>Tex, half scale)","notes":"Rank label is fixed by row (1st..5th); drawn once per race into the free cols (29-63) of each row."},{"id":"dash-standings-portrait-3","type":"icon","x":4,"y":158,"w":20,"h":20,"text":null,"fg":null,"bg":"#1A1041","touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintStandingsPortraits (kDashGlyphPortrait[snap->top5Character[3]], num=5 den=8 -> 20x20)","notes":"Real live character portrait, small (20x20) row. See dash-standings-portrait-0 for the full explanation."},{"id":"dash-standings-swatch-3","type":"icon","x":56,"y":156,"w":6,"h":6,"text":null,"fg":null,"bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashCharacterColour/DashPaintTop5Tags","notes":"Live colour swatch, supplementary to dash-standings-portrait-3. Repainted only when the top-5 roster changes."},{"id":"dash-standings-rank-4","type":"text","x":29,"y":190,"w":24,"h":16,"text":"5TH","fg":null,"bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintStandingsRanks (aPosition<N>Tex + aPositionOrdinalSuffix<X>Tex, half scale)","notes":"Rank label is fixed by row (1st..5th); drawn once per race into the free cols (29-63) of each row."},{"id":"dash-standings-portrait-4","type":"icon","x":4,"y":187,"w":20,"h":20,"text":null,"fg":null,"bg":"#1A1041","touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintStandingsPortraits (kDashGlyphPortrait[snap->top5Character[4]], num=5 den=8 -> 20x20)","notes":"Real live character portrait, last of the three small (20x20) rows. See dash-standings-portrait-0 for the full explanation."},{"id":"dash-standings-swatch-4","type":"icon","x":56,"y":185,"w":6,"h":6,"text":null,"fg":null,"bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashCharacterColour/DashPaintTop5Tags","notes":"Live colour swatch, supplementary to dash-standings-portrait-4. Repainted only when the top-5 roster changes."},{"id":"dash-standings-hilite","type":"box","x":1,"y":68,"w":62,"h":27,"text":null,"fg":null,"bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintTop5Tags (white DashStrokeRect)","notes":"CONDITIONAL: a white 1px border is drawn around whichever standings row currently matches our own race position (only when we are in the top 5 this tick); not shown at all otherwise."},{"id":"dash-lap-label","type":"text","x":258,"y":52,"w":60,"h":12,"text":"LAP","fg":null,"bg":null,"touch":false,"action":null,"source":"sDashWidgets['lap'] (DASHW_LAP), gdx3ds_hudbake.h kDashAssetWidgets['lap'], gdx3ds_bottomhud.c DashBakeSkipCell","notes":"Baked label (aLapTex), painted once per race. Widget moved down 26px (y 26->52) this round to make room for the new KO-stars box above it (see dash-ko-stars-box)."},{"id":"dash-lap-value","type":"text","x":260,"y":64,"w":56,"h":14,"text":"2/3","fg":null,"bg":"#100808","touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintRightColumnLap (\"%d/%d\", clamped lap; aLapCounterSymbolsTex glyphs)","notes":"FIXED (hardware feedback round item 7): \"when the race ends, this goes up to 4/3. Should be clamped.\" gRacers[0].lap keeps counting past gTotalLapCount in the decomp's own post-finish bookkeeping (left alone -- this is a display-only clamp). Live, every tick: displayed lap is now min(snap->lap, snap->totalLaps)."},{"id":"dash-time-label","type":"text","x":258,"y":85,"w":60,"h":18,"text":"TIME","fg":null,"bg":null,"touch":false,"action":null,"source":"sDashWidgets['timer'] (DASHW_TIMER), gdx3ds_hudbake.h kDashAssetWidgets['timer'], gdx3ds_bottomhud.c DashBakeSkipCell","notes":"Baked label (aHudTimeTex). Widget moved down 26px (y 59->85) this round, same KO-stars-box reshuffle as dash-lap-label."},{"id":"dash-time-value","type":"text","x":259,"y":103,"w":56,"h":20,"text":"0'42\"18","fg":null,"bg":"#100808","touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashFormatClock + DashPaintRightColumnTimer (current lap time, aTimerSymbolsTex glyphs)","notes":"Live, every tick: min'sec\"centisecond, same separators (prime/double-prime) hud.c's own Hud_DrawTimerScisThousandths uses."},{"id":"dash-best-label","type":"text","x":258,"y":119,"w":60,"h":18,"text":"BEST","fg":null,"bg":null,"touch":false,"action":null,"source":"sDashWidgets['timer'] (DASHW_TIMER), gdx3ds_hudbake.h kDashAssetWidgets['timer'], gdx3ds_bottomhud.c DashBakeSkipCell","notes":"Baked label (aBestTex)."},{"id":"dash-best-value","type":"text","x":259,"y":137,"w":56,"h":17,"text":"0'38\"94","fg":null,"bg":"#100808","touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintRightColumnTimer (best lap time, aTimerSymbolsTex glyphs)","notes":"Live, every tick."},{"id":"dash-gap-label","type":"text","x":258,"y":155,"w":62,"h":12,"text":"GAP","fg":null,"bg":null,"touch":false,"action":null,"source":"sDashWidgets['gap'] (DASHW_GAP), gdx3ds_hudbake.h kDashAssetWidgets['gap'], gdx3ds_bottomhud.c DashBakeSkipCell","notes":"Baked label (Font2). Widget moved down 26px (y 129->155) this round, same KO-stars-box reshuffle as dash-lap-label/dash-time-label."},{"id":"dash-gap-value","type":"text","x":259,"y":167,"w":58,"h":12,"text":"-1'22\"05","fg":null,"bg":"#100808","touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashFormatInterval + DashPaintRightColumnGap (signed gap-to-leader, aTimerSymbolsTex glyphs)","notes":"Live, every tick. Sign-prefixed (leading '-' when behind)."},{"id":"dash-ko-stars-box","type":"button","x":258,"y":26,"w":62,"h":22,"text":"\u2605 X0","fg":"#FFFFFF","bg":"#3A1029","touch":false,"action":null,"source":"sDashWidgets['ko_stars'] (DASHW_KO_STARS), gdx3ds_bottomhud.c DashPaintKOStars","notes":"NEW, REPLACES dash-boost-box/dash-boost-ready-badge (hardware feedback round item 6): \"[BOOST is] basically useless... more useful would be the 'knockout' stars... I'd put the stars at the top of this right side column.\" Shows the real game-wide knockout counter (gRacersKOd, same global hud.c's own Hud_DrawKOStars reads) as a 16x16 real star-icon texture (aHudRacersKOdTex) plus an \"X<N>\" numeral, centred. Same chip styling (#3A1029 fill, #FF6DB5 border) as MODE/MENU/SPEED. No baked backdrop -- fully procedural, like SPEED. Live, every tick."},{"id":"dash-speed-box","type":"button","x":258,"y":195,"w":62,"h":23,"text":"16 KPH","fg":"#FFFFFF","bg":"#3A1029","touch":false,"action":null,"source":"sDashWidgets['speed'] (DASHW_SPEED), gdx3ds_bottomhud.c DashPaintSpeed","notes":"FIXED (hardware feedback round item 8/extra): x moved 260->258, matching every other right-column widget's left edge and eliminating a 2px overflow past the 320px screen edge (old x=260 + w=62 = 322). No baked backdrop (new widget added in an earlier round to fill the gap the header/energy-bar vertical swap opened). Same chip styling (#3A1029 fill / #FF6DB5 border) as MODE/MENU/KO-stars, but not touchable. Live every tick, Font2 text best-fit to the box width."},{"id":"dash-map-box","type":"box","x":77,"y":36,"w":168,"h":168,"text":null,"fg":null,"bg":"#080808","touch":false,"action":null,"source":"sDashWidgets['map_box'] (DASHW_MAP_BOX), gdx3ds_bottomhud.c DashPaintMapBoxLive/DashPaintMapBox","notes":"SHRUNK + RECENTRED (hardware feedback round item 4): \"could probably afford to be a bit smaller, uses a lot of prime real estate.\" 192x192 -> 168x168 (destination-pixel-driven nearest-neighbour scale of the shared 64x64 CI8 course bitmap, not a fixed integer-replication scale any more, so it can be any size), recentred in the freed space between the portrait/standings column and the right-hand column. Racer markers drawn on top (per-marker colours, e.g. cyan=player1, blue=leader), same as before. Throttled to [debug] bottom_race_hz (default 10 Hz) inside DashPaintMapBoxLive, independent of the rest of the DASH's per-tick repaint. Falls back to a flat #080808 box with a white 1px border when no valid minimap bitmap is available yet."},{"id":"dash-energy-bar-panel","type":"box","x":0,"y":0,"w":320,"h":24,"text":"ENERGY","fg":"#FFFFFF","bg":null,"touch":false,"action":null,"source":"sDashWidgets['energy_bar'] (DASHW_ENERGY_BAR), gdx3ds_bottomhud.c DashPaintEnergyFrame, gdx3ds_hudbake.h kDashAssetWidgets['energy_bar']","notes":"FIXED (hardware feedback round item 1): \"Energy bar isn't flat... it has 'overflow' that is cut off on top.\" The baked art for this widget turned out to be a frozen flattened screenshot (not a reusable empty frame), so cols 54+ (the whole frame/fill zone) are now skipped at bake time and replaced with a small procedural flat panel (DashFillRect, fill #3885) + pink border (DashStrokeRect, #FB76) drawn once per race -- chosen over resizing/cropping the baked art because the baked pixels simply didn't contain a clean frame to crop to. Cols 7-53 (the 'ENERGY' label) stay baked, since that part of the original art was clean. The live fill rect inside the frame is unchanged -- see dash-energy-bar-fill."},{"id":"dash-energy-bar-fill","type":"bar","x":57,"y":4,"w":253,"h":16,"text":null,"fg":null,"bg":"#FF0000","touch":false,"action":null,"source":"gdx3ds_bottomhud.c DASH_ENERGY_FILL_*, kEnergyRowRed/kEnergyRowGreen, DashPaintEnergyFooter","notes":"Live, every tick: width = energyMilli/1000 of the 253px fill span. 5-row vertical 'glossy' shading, red family (#FF0000 mid-row, with an x-parity dither on row 3) when boost is not ready, green family (#00C621 mid-row) when boostReady -- reproduces hud.c's own sEnergyBarFillColors exactly; there is no continuous gradient or low-energy flashing in the original game."}]},{"id":"idle","name":"IDLE view (outside a live race)","notes":"NEW (idle-view round). Shown whenever the bottom screen is NOT a live-race DASH takeover and NOT the CUSTOM edit overlay: title screen, menus, attract mode, results, loading -- the coordinator's own ask was 'we shouldn't just have the bottom screen only show a polished experience during race... have the checkerboard always there, with the bottom menu option there and maybe just a g-diffuser logo.' Default ON ([debug] bottom_idle=1); falls back to the pre-existing text-console debug UI with bottom_idle=0, or with [debug] bottom_race=0 (which disables DASH-style rendering everywhere, not only mid-race). Reuses the SAME checkerboard background bake and the SAME 'header' baked chrome the race DASH uses (gdx3ds_bottomhud.c DashPaintBackdropBackground/DashCompositeAssetWidget, factored out of DashPaintBaked for this reuse) -- no second 320x240 background bake, so this view costs only the small logo bitmap (~36 KB) on top of what the race DASH already resident. Painted ONCE per entry (gdx3ds_bottomhud_idle_tick's own sIdleBaked latch), not every tick -- a genuinely static screen.","elements":[{"id":"idle-background","type":"box","x":0,"y":0,"w":320,"h":240,"text":null,"fg":"#7A5566","bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintBackdropBackground (factored out of DashPaintBaked), gdx3ds_hudbake.h gDashAssetBackground","notes":"Identical bake and dimming as dash-background in the 'dash' screen -- the SAME 150 KB RGB565 checker texture, reused as-is (see this screen's own top-level notes). UNCERTAIN exact colour, same caveat as dash-background."},{"id":"idle-header-panel","type":"box","x":0,"y":218,"w":320,"h":22,"text":null,"fg":null,"bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintIdleHeaderChrome (composites just the kDashAssetWidgets 'header' entry)","notes":"The SAME baked header panel the race DASH uses, with the same two live-text skip zones (col<150, col>=230) -- left as checkerboard here (no course name / racer count to show outside a race), not filled or relabelled."},{"id":"idle-logo","type":"icon","x":40,"y":71,"w":240,"h":76,"text":null,"fg":null,"bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintIdleLogo, gdx3ds_bottomhud_idle_assets.h kDashIdleLogoPixels (tools/gen_nibottom_idle_assets.py)","notes":"The repo's existing G-DIFFUSER brand wordmark (assets/branding/gdiffuser-logo-menu.png) -- the SAME file the desktop port's own title-screen menu logo already uses (port/gdx_menu.cpp, port/CMakeLists.txt, tools/gen_f3d_o2r.py) -- baked down to 240x76 RGBA5551 (LANCZOS resample, alpha-thresholded) and centred in the free area above the header band. Not a bespoke logo or hand-drawn Font2 text: the brief's own first preference (reuse an existing asset) was satisfied."},{"id":"idle-debug-button","type":"button","x":84,"y":221,"w":70,"h":16,"text":"DEBUG","fg":"#FFFFFF","bg":"#3A1029","touch":true,"action":"open the text-console debug UI (sets gdx3ds_bottomhud_idle_dismissed(); the tab bar's RACE/DASH slot, painted \"DASH\", comes back to resume this view)","source":"gdx3ds_bottomhud.c DashPaintBackButton (shared verbatim with the race DASH and CUSTOM mode) / gdx3ds_bottomhud_idle_tick touch handler","notes":"Same rect, same chip styling, same chrome-paint function as dash-debug-button in the 'dash' screen -- literally the same button, reused. A 1.5s (90-tick) KEY_SELECT hold does the same thing without touching it (gdx3ds_bottomhud_idle_tick's own sIdleSelectHoldTicks)."}]},{"id":"dash-custom-edit","name":"DASH CUSTOM mode, edit session","notes":"A 4th HUD placement mode (GDX_HUD_PLACEMENT_CUSTOM, beyond ALL_TOP/SPLIT/ALL_BOTTOM), reached by cycling the MODE chip (label reads 'MODE Z') or the DBG tab's 'HUD EDIT' button (reachable even with no live race -- sample values shown). CUSTOM mode never reuses the baked pixel art the other 3 modes do (a baked asset can't stretch to an arbitrary user size): every editable widget is a generic flat box (sCustomWidgets[], gdx3ds_bottomhud.c) with a short label and a live value, draggable (8px grid snap) and resizable (8 or 16px steps per widget; dash-portrait/RANK is drag-only, fixed size). This screen depicts an EDIT SESSION specifically (the EDIT button reads 'DONE', widgets show close/resize handles and the LAP widget is SELECTED mid-drag); the plain CUSTOM view (not editing) looks the same minus the handles/tray and with the EDIT button reading 'EDIT'. RESET restores every widget to its ALL_BOTTOM default position, all visible, and saves immediately; DONE exits edit mode and saves the current layout -- hud.ini's own [custom] section, written only on RESET/DONE, never every frame. GAP and standings (TOP5) have no top-screen counterpart at all (hide-only); every other editable widget maps to one GDX_HUD_ELEM_* bit (gdx3ds_hudcustom.h) that the eventual real native/nihudtop top-screen gating will read via gdx_hud_set_custom_top_mask() -- until that merges, the top screen simply follows ALL_BOTTOM behaviour while CUSTOM is active (gdx3ds_bottomhud_placement_mode() reports ALL_BOTTOM to port/input_bridge.c for any CUSTOM mode).","elements":[{"id":"dash-custom-background","type":"box","x":0,"y":0,"w":320,"h":240,"text":null,"fg":null,"bg":"#181818","touch":false,"action":null,"source":"gdx3ds_bottomhud.c gdx3ds_bottomhud_tick (sCustomBackdropPainted 0->1 edge, flat fill 0x18C3)","notes":"CUSTOM mode's own once-per-entry flat backdrop -- replaces the baked pink-checker background the other 3 modes use, since this mode's widgets can be resized to sizes baked art cannot stretch to."},{"id":"dash-custom-debug-button","type":"button","x":84,"y":221,"w":70,"h":16,"text":"DEBUG","fg":"#FFFFFF","bg":"#3A1029","touch":true,"action":"dismiss the DASH takeover (same as every other mode); exits edit mode WITHOUT saving (RESET/DONE are the only save points)","source":"sDashWidgets['menu_button'], gdx3ds_bottomhud.c DashPaintBackButton, painted once at the custom backdrop edge","notes":"Unchanged from the other 3 modes -- CUSTOM mode still paints this fixed chrome element via the same function. Labelled \"DEBUG\" (was \"MENU\") as of the idle-view round -- see dash-debug-button's own notes."},{"id":"dash-custom-mode-chip","type":"button","x":168,"y":221,"w":62,"h":16,"text":"MODE Z","fg":"#FFFFFF","bg":"#3A1029","touch":true,"action":"cycle HUD placement ALL_TOP -> SPLIT -> ALL_BOTTOM -> CUSTOM -> ALL_TOP; disabled while sEditMode is active (no accidental mode change mid-drag)","source":"sDashWidgets['mode_chip'], gdx3ds_bottomhud.c DashModeChipLabel/DashPaintModeLabel/DashPaintModeDot","notes":"'MODE Z' is the brief's own suggested CUSTOM label; the colour dot (gdx3ds_bottomhud.c kModeColour, now sized GDX_HUD_PLACEMENT_CUSTOM+1) is cyan for CUSTOM."},{"id":"dash-custom-reset-button","type":"button","x":2,"y":221,"w":38,"h":16,"text":"RESET","fg":"#FFFFFF","bg":"#3A1029","touch":true,"action":"restore every editable widget to its default ALL_BOTTOM rect, all visible, and save immediately","source":"gdx3ds_bottomhud.c DashPaintCustomChrome / DashCustomReset, DASH_RESET_* rects","notes":"New in CUSTOM mode only, in the header's one remaining free gap left of the DEBUG button."},{"id":"dash-custom-edit-toggle","type":"button","x":42,"y":221,"w":38,"h":16,"text":"DONE","fg":"#FFFFFF","bg":"#3A1029","touch":true,"action":"toggle edit mode; label reads EDIT when viewing, DONE (shown here) while editing -- tapping it while editing saves the layout to hud.ini's [custom] section","source":"gdx3ds_bottomhud.c DashPaintCustomChrome / DashCustomToggleEdit, DASH_EDIT_* rects","notes":"Border is bright white while editing (matches a selected widget's own highlight colour) to read as 'currently active', dim pink otherwise."},{"id":"dash-custom-widget-energy","type":"box","x":0,"y":0,"w":320,"h":24,"text":"ENERGY 62%","fg":"#FFFFFF","bg":"#3A1029","touch":true,"action":"drag to move (8px snap); resize handle at the bottom-right corner (8px snap); close X at the top-right corner hides it to the tray","source":"sCustomWidgets[DASHW_ENERGY_BAR], gdx3ds_bottomhud.c DashPaintCustomWidget(DASHW_ENERGY_BAR)","notes":"Default ALL_BOTTOM rect (full-width energy strip). Maps to GDX_HUD_ELEM_ENERGY on the (future) top screen when hidden here."},{"id":"dash-custom-widget-lap-selected","type":"box","x":258,"y":52,"w":60,"h":28,"text":"LAP 2/3","fg":"#FFFFFF","bg":"#3A1029","touch":true,"action":"SELECTED: border is bright white, not the usual pink -- shown here mid-drag","source":"sCustomWidgets[DASHW_LAP], gdx3ds_bottomhud.c DashPaintCustomWidget(DASHW_LAP, selected=1)","notes":"Depicts the 'currently selected widget' state DashCustomHandleTouch sets on a body touch-down. Maps to GDX_HUD_ELEM_LAP."},{"id":"dash-custom-widget-lap-close-x","type":"button","x":301,"y":53,"w":8,"h":8,"text":"X","fg":"#FFFFFF","bg":"#FF0000","touch":true,"action":"close (hide to the tray); becomes a GDX_HUD_ELEM_LAP top-screen element once the real gating merges","source":"gdx3ds_bottomhud.c DashPaintEditHandles, GDX_HUDCUSTOM_HANDLE-sized close box, top-right corner","notes":"Drawn on EVERY visible editable widget while editing, not only the selected one -- closing something should never require selecting it first."},{"id":"dash-custom-widget-lap-resize-handle","type":"button","x":301,"y":71,"w":8,"h":8,"text":null,"fg":null,"bg":"#00FFFF","touch":true,"action":"drag to resize (8px grid, min 32x16)","source":"gdx3ds_bottomhud.c DashPaintEditHandles, bottom-right corner, only for DashWidgetResizable() widgets","notes":"LAP resizes in 8px steps (the default); MAP_BOX/KO_STARS use 16px steps and PORTRAIT is drag-only (no handle drawn at all)."},{"id":"dash-custom-widget-speed","type":"box","x":258,"y":195,"w":62,"h":23,"text":"SPEED 184 KPH","fg":"#FFFFFF","bg":"#3A1029","touch":true,"action":"drag to move; resize handle; close X","source":"sCustomWidgets[DASHW_SPEED], gdx3ds_bottomhud.c DashPaintCustomWidget(DASHW_SPEED)","notes":"Maps to GDX_HUD_ELEM_SPEED."},{"id":"dash-custom-widget-map","type":"box","x":77,"y":36,"w":168,"h":168,"text":"MAP","fg":"#FFFFFF","bg":"#3A1029","touch":true,"action":"drag to move; resize handle (16px steps, min 48x48); close X","source":"sCustomWidgets[DASHW_MAP_BOX], gdx3ds_bottomhud.c DashPaintCustomWidget(DASHW_MAP_BOX)","notes":"Generic labelled box in CUSTOM mode, not the live minimap bitmap -- the real minimap render is one of the fancy per-widget paint functions CUSTOM mode deliberately does not reuse (see the screen's own top-level note). Maps to GDX_HUD_ELEM_MINIMAP."},{"id":"dash-custom-tray","type":"box","x":0,"y":24,"w":320,"h":14,"text":null,"fg":null,"bg":null,"touch":false,"action":null,"source":"gdx3ds_bottomhud.c DashPaintTray, DASH_TRAY_Y0=24","notes":"Reserved strip for the hidden-widget tray while editing; drawn (and only drawn) over whatever would otherwise be at y24-37, after every widget box so its chips always read on top. Only occupied by actual chips when at least one editable widget is hidden -- see dash-custom-tray-chip-gap/dash-custom-tray-chip-ko below for the two in this depiction."},{"id":"dash-custom-tray-chip-gap","type":"button","x":2,"y":24,"w":32,"h":14,"text":"GAP","fg":"#FFFFFF","bg":"#082010","touch":true,"action":"tap to restore: re-enables the widget at its last-known rect","source":"gdx3ds_bottomhud.c DashPaintTray/DashCustomHandleTouch, one 32x14 chip per hidden editable widget","notes":"GAP has no top-screen counterpart at all (brief's own example); hiding it here is a pure declutter, not a top-screen relocation."},{"id":"dash-custom-tray-chip-ko","type":"button","x":36,"y":24,"w":32,"h":14,"text":"KO","fg":"#FFFFFF","bg":"#082010","touch":true,"action":"tap to restore","source":"gdx3ds_bottomhud.c DashPaintTray/DashCustomHandleTouch","notes":"KO_STARS maps to GDX_HUD_ELEM_KOSTARS -- hiding it here is what would (eventually) move the knockout-star readout to the top screen."}]}]}/*END-SEED*/</script>
<script>
"use strict";

const STORAGE_KEY = "gdx-bottom-designer-v1";
const SCREEN_W = 320;
const SCREEN_H = 240;
const CELL = 8;
const ELEMENT_TYPES = ["text", "button", "tab", "box", "bar", "icon"];
const PIN_STATUSES = ["change", "question", "bug", "idea", "done"];

const FALLBACK_SEED = {
  version: 1,
  source: "fallback (no extracted layout embedded)",
  screen: { w: SCREEN_W, h: SCREEN_H },
  screens: [
    { id: "menu-STA", name: "MENU · STA tab", notes: "", elements: [
      { id: "tab-sta", type: "tab", x: 0, y: 0, w: 24, h: 8, text: "STA", fg: "#000000", bg: "#ffffff", touch: true, action: "show STA tab" },
      { id: "tab-off", type: "button", x: 296, y: 0, w: 24, h: 8, text: "OFF", fg: "#000000", bg: "#ffffff", touch: true, action: "turn bottom screen off" }
    ] },
    { id: "dash", name: "DASH (race HUD)", notes: "", elements: [] }
  ]
};

const seed = loadSeed();
const seedFingerprint = fingerprintOf(JSON.stringify(seed));
let design = loadSavedDesign() || cloneDesignFromSeed();
let currentScreenIndex = 0;
let selectedElementId = null;
let selectedPinId = null;
let mode = "select";
let zoom = 2;
let zoomFit = true;
let showGrid = true;
let snapToCells = true;
let showGhost = false;
let showTouch = true;
const undoStack = [];

// ---------- data ----------

function loadSeed() {
  const raw = document.getElementById("seed").textContent.replace(/^\s*\/\*SEED\*\//, "").replace(/\/\*END-SEED\*\/\s*$/, "").trim();
  try {
    const parsed = JSON.parse(raw);
    if (parsed && Array.isArray(parsed.screens)) {
      return parsed;
    }
  } catch (err) {
    console.warn("seed parse failed", err);
  }
  return FALLBACK_SEED;
}

function fingerprintOf(text) {
  let hash = 2166136261;
  for (let i = 0; i < text.length; i++) {
    hash = Math.imul(hash ^ text.charCodeAt(i), 16777619);
  }
  return (hash >>> 0).toString(16);
}

function cloneDesignFromSeed() {
  const copy = JSON.parse(JSON.stringify(seed));
  copy.seedSource = seed.source || "";
  copy.seedFingerprint = seedFingerprint;
  for (const screen of copy.screens) {
    normalizeScreen(screen);
  }
  return copy;
}

function normalizeScreen(screen) {
  screen.elements = screen.elements || [];
  screen.pins = screen.pins || [];
  screen.notes = screen.notes || "";
  screen.bg = screen.bg || null;
}

function loadSavedDesign() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      return null;
    }
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.screens)) {
      return null;
    }
    parsed.screens.forEach(normalizeScreen);
    if (parsed.seedFingerprint !== seedFingerprint) {
      return rebaseOntoSeed(parsed);
    }
    return parsed;
  } catch (err) {
    return null;
  }
}

// A save made against an older (or missing) extracted layout keeps its notes and extra screens,
// but takes its elements from the current seed so the canvas shows what the game draws today.
function rebaseOntoSeed(saved) {
  const rebased = cloneDesignFromSeed();
  for (const savedScreen of saved.screens) {
    const target = rebased.screens.find(screen => screen.id === savedScreen.id);
    if (!target) {
      rebased.screens.push(savedScreen);
      continue;
    }
    target.pins = savedScreen.pins;
    target.bg = savedScreen.bg;
    if (savedScreen.notes) {
      target.notes = savedScreen.notes;
    }
  }
  return rebased;
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(design));
  } catch (err) {
    setStatus("Autosave unavailable (browser storage blocked) — use Save for Claude.");
  }
}

function pushUndo() {
  undoStack.push(JSON.stringify(design));
  if (undoStack.length > 150) {
    undoStack.shift();
  }
}

function undo() {
  if (undoStack.length === 0) {
    toast("Nothing to undo");
    return;
  }
  design = JSON.parse(undoStack.pop());
  currentScreenIndex = Math.min(currentScreenIndex, design.screens.length - 1);
  selectedElementId = null;
  selectedPinId = null;
  commit(false);
}

function commit(recordUndo) {
  persist();
  renderAll();
}

function currentScreen() {
  return design.screens[currentScreenIndex];
}

function seedScreenFor(screen) {
  const seedId = screen.seedId || screen.id;
  return seed.screens.find(s => s.id === seedId) || null;
}

function findElement(id) {
  return currentScreen().elements.find(e => e.id === id) || null;
}

function findPin(id) {
  return currentScreen().pins.find(p => p.id === id) || null;
}

function uniqueId(prefix, taken) {
  let n = 1;
  while (taken.has(`${prefix}-${n}`)) {
    n++;
  }
  return `${prefix}-${n}`;
}

function snap(value) {
  if (!snapToCells) {
    return Math.round(value);
  }
  return Math.round(value / CELL) * CELL;
}

function clamp(value, lo, hi) {
  return Math.max(lo, Math.min(hi, value));
}

// ---------- rendering ----------

function renderAll() {
  renderScreenList();
  renderStage();
  renderProps();
}

function renderScreenList() {
  const list = document.getElementById("screenList");
  list.innerHTML = "";
  design.screens.forEach((screen, index) => {
    const item = document.createElement("div");
    item.className = "item" + (index === currentScreenIndex ? " active" : "");
    const pinCount = screen.pins.filter(p => p.status !== "done").length;
    item.innerHTML = `<span></span><span class="badge">${pinCount ? pinCount + " note" + (pinCount > 1 ? "s" : "") : ""}</span>`;
    item.firstChild.textContent = screen.name || screen.id;
    item.onclick = () => selectScreen(index);
    list.appendChild(item);
  });
}

function selectScreen(index) {
  currentScreenIndex = index;
  selectedElementId = null;
  selectedPinId = null;
  renderAll();
}

function renderStage() {
  const screen = currentScreen();
  const stage = document.getElementById("stage");
  const scaler = document.getElementById("stageScaler");
  stage.style.transform = `scale(${zoom})`;
  scaler.style.width = SCREEN_W * zoom + "px";
  scaler.style.height = SCREEN_H * zoom + "px";
  stage.classList.toggle("notes-mode", mode === "note");
  stage.innerHTML = "";
  document.getElementById("screenTitle").textContent = screen.name || screen.id;
  if (screen.bg) {
    const img = document.createElement("img");
    img.className = "bgimg";
    img.src = screen.bg;
    stage.appendChild(img);
  }
  if (showGrid) {
    const grid = document.createElement("div");
    grid.className = "gridlay";
    stage.appendChild(grid);
  }
  for (const element of screen.elements) {
    stage.appendChild(buildElementNode(element, true));
  }
  if (showGhost) {
    stage.appendChild(buildGhostLayer(screen));
  }
  screen.pins.forEach((pin, index) => {
    stage.appendChild(buildPinNode(pin, index));
  });
}

function buildElementNode(element, interactive) {
  const node = document.createElement("div");
  node.className = `el ${element.type}`;
  if (showTouch && element.touch) {
    node.classList.add("touch");
  }
  if (interactive && element.id === selectedElementId) {
    node.classList.add("sel");
  }
  node.dataset.id = element.id;
  node.style.left = element.x + "px";
  node.style.top = element.y + "px";
  node.style.width = Math.max(1, element.w) + "px";
  node.style.height = Math.max(1, element.h) + "px";
  node.style.color = element.fg || "#ffffff";
  node.style.background = element.bg || "transparent";
  if (element.fontScale && element.fontScale > 1) {
    node.style.fontSize = 8 * element.fontScale + "px";
    node.style.lineHeight = 8 * element.fontScale + "px";
  }
  if (element.type === "bar") {
    const fill = document.createElement("div");
    fill.className = "fill";
    fill.style.width = clamp(element.value ?? 60, 0, 100) + "%";
    node.appendChild(fill);
  } else {
    node.textContent = element.text || "";
  }
  if (interactive) {
    node.title = element.notes || element.action || element.id;
    node.addEventListener("pointerdown", ev => onElementPointerDown(ev, element.id));
    if (element.id === selectedElementId) {
      const handle = document.createElement("div");
      handle.className = "handle";
      handle.addEventListener("pointerdown", ev => onResizePointerDown(ev, element.id));
      node.appendChild(handle);
    }
  }
  return node;
}

function buildGhostLayer(screen) {
  const layer = document.createElement("div");
  layer.className = "ghost";
  const original = seedScreenFor(screen);
  if (!original) {
    return layer;
  }
  for (const element of original.elements || []) {
    layer.appendChild(buildElementNode(element, false));
  }
  return layer;
}

function buildPinNode(pin, index) {
  const node = document.createElement("div");
  node.className = "pin" + (pin.status === "done" ? " done" : "") + (pin.id === selectedPinId ? " sel" : "");
  node.style.left = pin.x + "px";
  node.style.top = pin.y + "px";
  node.title = pin.text || "(empty note)";
  const label = document.createElement("span");
  label.textContent = String(index + 1);
  node.appendChild(label);
  node.addEventListener("pointerdown", ev => onPinPointerDown(ev, pin.id));
  return node;
}

// ---------- properties panel ----------

function renderProps() {
  const panel = document.getElementById("props");
  panel.innerHTML = "";
  if (selectedElementId && findElement(selectedElementId)) {
    renderElementProps(panel, findElement(selectedElementId));
  } else if (selectedPinId && findPin(selectedPinId)) {
    renderPinProps(panel, findPin(selectedPinId));
  } else {
    renderScreenProps(panel, currentScreen());
  }
}

function addHeading(panel, text) {
  const h = document.createElement("h2");
  h.textContent = text;
  panel.appendChild(h);
}

function addField(panel, labelText, control) {
  const wrap = document.createElement("div");
  wrap.className = "field";
  const label = document.createElement("label");
  label.textContent = labelText;
  wrap.appendChild(label);
  wrap.appendChild(control);
  panel.appendChild(wrap);
  return control;
}

function textInput(value, onChange, multiline) {
  const input = document.createElement(multiline ? "textarea" : "input");
  input.value = value ?? "";
  input.addEventListener("focus", pushUndo, { once: true });
  input.addEventListener("input", () => onChange(input.value));
  input.addEventListener("change", () => renderAll());
  return input;
}

function selectInput(options, value, onChange) {
  const select = document.createElement("select");
  for (const opt of options) {
    const o = document.createElement("option");
    o.value = opt;
    o.textContent = opt;
    if (opt === value) {
      o.selected = true;
    }
    select.appendChild(o);
  }
  select.addEventListener("change", () => {
    pushUndo();
    onChange(select.value);
    commit();
  });
  return select;
}

function colorInput(value, allowNone, onChange) {
  const wrap = document.createElement("div");
  wrap.className = "row";
  wrap.style.margin = "0";
  const picker = document.createElement("input");
  picker.type = "color";
  picker.value = value || "#000000";
  picker.style.width = "44px";
  picker.style.padding = "0";
  const none = document.createElement("button");
  none.textContent = allowNone ? "none" : "";
  none.hidden = !allowNone;
  const label = document.createElement("span");
  label.className = "hint";
  label.textContent = value || "none";
  picker.addEventListener("focus", pushUndo);
  picker.addEventListener("input", () => {
    label.textContent = picker.value;
    onChange(picker.value);
    persist();
    renderStage();
  });
  none.addEventListener("click", () => {
    pushUndo();
    onChange(null);
    commit();
  });
  wrap.append(picker, none, label);
  return wrap;
}

function renderElementProps(panel, element) {
  addHeading(panel, "Element");
  addField(panel, "id", textInput(element.id, v => { element.id = v; selectedElementId = v; persist(); }));
  addField(panel, "type", selectInput(ELEMENT_TYPES, element.type, v => { element.type = v; }));
  if (element.type !== "bar") {
    addField(panel, "text", textInput(element.text, v => { element.text = v; persist(); renderStage(); }, true));
  } else {
    const value = document.createElement("input");
    value.type = "range";
    value.min = "0";
    value.max = "100";
    value.value = element.value ?? 60;
    value.addEventListener("input", () => { element.value = Number(value.value); persist(); renderStage(); });
    addField(panel, "fill %", value);
  }
  const geometry = document.createElement("div");
  geometry.className = "grid4";
  for (const key of ["x", "y", "w", "h"]) {
    const input = document.createElement("input");
    input.type = "number";
    input.value = element[key];
    input.title = key;
    input.addEventListener("focus", pushUndo, { once: true });
    input.addEventListener("input", () => { element[key] = Number(input.value) || 0; persist(); renderStage(); });
    geometry.appendChild(input);
  }
  addField(panel, "x y w h", geometry);
  const cellHint = document.createElement("div");
  cellHint.className = "hint";
  cellHint.textContent = `console cell col ${Math.floor(element.x / CELL)}, row ${Math.floor(element.y / CELL)}`;
  panel.appendChild(cellHint);
  addField(panel, "text size", selectInput(["1", "2", "3"], String(element.fontScale || 1), v => { element.fontScale = Number(v); }));
  addField(panel, "text color", colorInput(element.fg, false, v => { element.fg = v; }));
  addField(panel, "fill", colorInput(element.bg, true, v => { element.bg = v; }));
  const touch = document.createElement("input");
  touch.type = "checkbox";
  touch.checked = !!element.touch;
  touch.style.width = "auto";
  touch.addEventListener("change", () => { pushUndo(); element.touch = touch.checked; commit(); });
  addField(panel, "tappable", touch);
  addField(panel, "on tap", textInput(element.action, v => { element.action = v; persist(); }));
  addField(panel, "notes", textInput(element.notes, v => { element.notes = v; persist(); }, true));
  if (element.source) {
    const src = document.createElement("div");
    src.className = "hint";
    src.textContent = "code: " + element.source;
    panel.appendChild(src);
  }
  const row = document.createElement("div");
  row.className = "row";
  const dup = document.createElement("button");
  dup.textContent = "Duplicate";
  dup.onclick = duplicateSelected;
  const pinIt = document.createElement("button");
  pinIt.textContent = "Add note here";
  pinIt.onclick = () => addPinAt(element.x + element.w, element.y, element.id);
  const del = document.createElement("button");
  del.textContent = "Delete";
  del.className = "danger";
  del.onclick = deleteSelected;
  row.append(dup, pinIt, del);
  panel.appendChild(row);
  renderPinsForElement(panel, element.id);
}

function renderPinsForElement(panel, elementId) {
  const pins = currentScreen().pins.filter(p => p.elementId === elementId);
  if (pins.length === 0) {
    return;
  }
  addHeading(panel, "Notes on this element");
  renderPinList(panel, pins);
}

function renderPinProps(panel, pin) {
  const index = currentScreen().pins.indexOf(pin);
  addHeading(panel, `Note ${index + 1}`);
  const text = addField(panel, "note", textInput(pin.text, v => { pin.text = v; persist(); }, true));
  text.style.minHeight = "120px";
  setTimeout(() => text.focus(), 0);
  addField(panel, "kind", selectInput(PIN_STATUSES, pin.status, v => { pin.status = v; }));
  const elementIds = ["(none)"].concat(currentScreen().elements.map(e => e.id));
  addField(panel, "about", selectInput(elementIds, pin.elementId || "(none)", v => { pin.elementId = v === "(none)" ? null : v; }));
  const pos = document.createElement("div");
  pos.className = "hint";
  pos.textContent = `at x ${pin.x}, y ${pin.y} — drag the dot to move it`;
  panel.appendChild(pos);
  const row = document.createElement("div");
  row.className = "row";
  const del = document.createElement("button");
  del.textContent = "Delete note";
  del.className = "danger";
  del.onclick = () => {
    pushUndo();
    currentScreen().pins = currentScreen().pins.filter(p => p.id !== pin.id);
    selectedPinId = null;
    commit();
  };
  row.appendChild(del);
  panel.appendChild(row);
}

function renderScreenProps(panel, screen) {
  addHeading(panel, "Screen");
  addField(panel, "name", textInput(screen.name, v => { screen.name = v; persist(); }));
  addField(panel, "notes", textInput(screen.notes, v => { screen.notes = v; persist(); }, true)).style.minHeight = "90px";
  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = "General notes about this whole screen go above. Use “Add note” to pin a note to a spot.";
  panel.appendChild(hint);
  addHeading(panel, `Notes (${screen.pins.length})`);
  if (screen.pins.length === 0) {
    const empty = document.createElement("div");
    empty.className = "hint";
    empty.textContent = "No notes yet.";
    panel.appendChild(empty);
  } else {
    renderPinList(panel, screen.pins);
  }
  addHeading(panel, `Elements (${screen.elements.length})`);
  const list = document.createElement("div");
  list.className = "list";
  for (const element of screen.elements) {
    const item = document.createElement("div");
    item.className = "item";
    item.innerHTML = "<span></span><span class='badge'></span>";
    item.firstChild.textContent = element.text ? element.text.slice(0, 22) : element.id;
    item.lastChild.textContent = element.type;
    item.onclick = () => { selectedElementId = element.id; renderAll(); };
    list.appendChild(item);
  }
  panel.appendChild(list);
}

function renderPinList(panel, pins) {
  const wrap = document.createElement("div");
  wrap.className = "pinlist";
  const all = currentScreen().pins;
  for (const pin of pins) {
    const item = document.createElement("div");
    item.className = "p" + (pin.id === selectedPinId ? " active" : "");
    const head = document.createElement("div");
    head.innerHTML = `<b>${all.indexOf(pin) + 1}</b> <span class="hint"></span>`;
    head.lastChild.textContent = pin.status + (pin.elementId ? " · " + pin.elementId : "");
    const body = document.createElement("div");
    body.textContent = pin.text || "(empty)";
    item.append(head, body);
    item.onclick = () => { selectedPinId = pin.id; selectedElementId = null; renderAll(); };
    wrap.appendChild(item);
  }
  panel.appendChild(wrap);
}

// ---------- pointer interaction ----------

function stagePoint(ev) {
  const rect = document.getElementById("stage").getBoundingClientRect();
  return {
    x: clamp(Math.round((ev.clientX - rect.left) / zoom), 0, SCREEN_W),
    y: clamp(Math.round((ev.clientY - rect.top) / zoom), 0, SCREEN_H)
  };
}

function elementAtPoint(point) {
  const elements = currentScreen().elements;
  for (let i = elements.length - 1; i >= 0; i--) {
    const e = elements[i];
    if (point.x >= e.x && point.x < e.x + e.w && point.y >= e.y && point.y < e.y + e.h) {
      return e;
    }
  }
  return null;
}

function onStagePointerDown(ev) {
  if (ev.target.closest(".el") || ev.target.closest(".pin")) {
    return;
  }
  const point = stagePoint(ev);
  if (mode === "note") {
    const under = elementAtPoint(point);
    addPinAt(point.x, point.y, under ? under.id : null);
    return;
  }
  selectedElementId = null;
  selectedPinId = null;
  renderAll();
}

function onElementPointerDown(ev, elementId) {
  if (ev.target.classList.contains("handle")) {
    return;
  }
  ev.preventDefault();
  if (mode === "note") {
    const point = stagePoint(ev);
    addPinAt(point.x, point.y, elementId);
    return;
  }
  selectedElementId = elementId;
  selectedPinId = null;
  const element = findElement(elementId);
  const start = stagePoint(ev);
  const origin = { x: element.x, y: element.y };
  let moved = false;
  renderAll();
  trackPointer(ev, moveEv => {
    const now = stagePoint(moveEv);
    if (!moved && Math.abs(now.x - start.x) + Math.abs(now.y - start.y) < 2) {
      return;
    }
    if (!moved) {
      pushUndo();
      moved = true;
    }
    element.x = clamp(snap(origin.x + now.x - start.x), 0, SCREEN_W - 1);
    element.y = clamp(snap(origin.y + now.y - start.y), 0, SCREEN_H - 1);
    updateElementNodePosition(element);
  }, () => {
    if (moved) {
      commit();
    }
  });
}

function onResizePointerDown(ev, elementId) {
  ev.preventDefault();
  ev.stopPropagation();
  const element = findElement(elementId);
  pushUndo();
  trackPointer(ev, moveEv => {
    const now = stagePoint(moveEv);
    element.w = Math.max(snapToCells ? CELL : 1, snap(now.x - element.x));
    element.h = Math.max(snapToCells ? CELL : 1, snap(now.y - element.y));
    updateElementNodePosition(element);
  }, () => commit());
}

function onPinPointerDown(ev, pinId) {
  ev.preventDefault();
  ev.stopPropagation();
  selectedPinId = pinId;
  selectedElementId = null;
  const pin = findPin(pinId);
  let moved = false;
  renderAll();
  trackPointer(ev, moveEv => {
    if (!moved) {
      pushUndo();
      moved = true;
    }
    const now = stagePoint(moveEv);
    pin.x = now.x;
    pin.y = now.y;
    const node = [...document.querySelectorAll(".pin")][currentScreen().pins.indexOf(pin)];
    if (node) {
      node.style.left = pin.x + "px";
      node.style.top = pin.y + "px";
    }
  }, () => {
    if (moved) {
      commit();
    }
  });
}

function trackPointer(downEv, onMove, onUp) {
  const move = ev => onMove(ev);
  const up = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    onUp();
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

function updateElementNodePosition(element) {
  const node = document.querySelector(`#stage > .el[data-id="${CSS.escape(element.id)}"]`);
  if (!node) {
    return;
  }
  node.style.left = element.x + "px";
  node.style.top = element.y + "px";
  node.style.width = element.w + "px";
  node.style.height = element.h + "px";
  setStatus(`${element.id}: x ${element.x} y ${element.y} w ${element.w} h ${element.h}`);
}

// ---------- commands ----------

function addElement(type) {
  pushUndo();
  const screen = currentScreen();
  const taken = new Set(screen.elements.map(e => e.id));
  const defaults = {
    text: { w: 64, h: 8, text: "TEXT", fg: "#ffffff", bg: null },
    button: { w: 48, h: 16, text: "BTN", fg: "#ffffff", bg: "#303040", touch: true },
    tab: { w: 32, h: 8, text: "TAB", fg: "#000000", bg: "#c0c0c0", touch: true },
    box: { w: 96, h: 48, text: "", fg: "#808080", bg: null },
    bar: { w: 96, h: 8, text: "", fg: "#40e040", bg: "#202020", value: 60 },
    icon: { w: 24, h: 24, text: "ICON", fg: "#ffcc00", bg: null }
  };
  const element = Object.assign({ id: uniqueId(type, taken), type, x: 128, y: 112, touch: false, action: "", notes: "" }, defaults[type]);
  screen.elements.push(element);
  selectedElementId = element.id;
  selectedPinId = null;
  setMode("select");
  commit();
}

function duplicateSelected() {
  const element = findElement(selectedElementId);
  if (!element) {
    return;
  }
  pushUndo();
  const taken = new Set(currentScreen().elements.map(e => e.id));
  const copy = JSON.parse(JSON.stringify(element));
  copy.id = uniqueId(element.id.replace(/-\d+$/, ""), taken);
  copy.x = clamp(copy.x + CELL, 0, SCREEN_W - 1);
  copy.y = clamp(copy.y + CELL, 0, SCREEN_H - 1);
  delete copy.source;
  currentScreen().elements.push(copy);
  selectedElementId = copy.id;
  commit();
}

function deleteSelected() {
  if (selectedElementId) {
    pushUndo();
    currentScreen().elements = currentScreen().elements.filter(e => e.id !== selectedElementId);
    selectedElementId = null;
    commit();
  } else if (selectedPinId) {
    pushUndo();
    currentScreen().pins = currentScreen().pins.filter(p => p.id !== selectedPinId);
    selectedPinId = null;
    commit();
  }
}

function addPinAt(x, y, elementId) {
  pushUndo();
  const screen = currentScreen();
  const taken = new Set(screen.pins.map(p => p.id));
  const pin = { id: uniqueId("note", taken), x, y, text: "", status: "change", elementId: elementId || null };
  screen.pins.push(pin);
  selectedPinId = pin.id;
  selectedElementId = null;
  commit();
}

function nudgeSelected(dx, dy, resize) {
  const element = findElement(selectedElementId);
  if (!element) {
    return;
  }
  pushUndo();
  if (resize) {
    element.w = Math.max(1, element.w + dx);
    element.h = Math.max(1, element.h + dy);
  } else {
    element.x = clamp(element.x + dx, 0, SCREEN_W - 1);
    element.y = clamp(element.y + dy, 0, SCREEN_H - 1);
  }
  commit();
}

function setMode(next) {
  mode = next;
  document.getElementById("btnSelectMode").classList.toggle("on", mode === "select");
  document.getElementById("btnNoteMode").classList.toggle("on", mode === "note");
  setStatus(mode === "note" ? "Click anywhere on the screen to drop a note." : "");
  renderStage();
}

function addScreen() {
  pushUndo();
  const taken = new Set(design.screens.map(s => s.id));
  const screen = { id: uniqueId("new-screen", taken), name: "New screen", notes: "", elements: [], pins: [], bg: null };
  design.screens.push(screen);
  currentScreenIndex = design.screens.length - 1;
  commit();
}

function duplicateScreen() {
  pushUndo();
  const source = currentScreen();
  const taken = new Set(design.screens.map(s => s.id));
  const copy = JSON.parse(JSON.stringify(source));
  copy.seedId = source.seedId || source.id;
  copy.id = uniqueId(source.id + "-v", taken);
  copy.name = source.name + " (variant)";
  design.screens.splice(currentScreenIndex + 1, 0, copy);
  currentScreenIndex++;
  commit();
}

function deleteScreen() {
  if (design.screens.length <= 1) {
    toast("Need at least one screen");
    return;
  }
  if (!confirm(`Delete screen “${currentScreen().name}”?`)) {
    return;
  }
  pushUndo();
  design.screens.splice(currentScreenIndex, 1);
  currentScreenIndex = Math.max(0, currentScreenIndex - 1);
  commit();
}

// ---------- export / import ----------

function summarizeChanges() {
  const changes = [];
  for (const screen of design.screens) {
    const original = seedScreenFor(screen);
    if (!original) {
      changes.push({ screen: screen.id, change: "new screen", elements: screen.elements.length });
      continue;
    }
    const before = new Map((original.elements || []).map(e => [e.id, e]));
    const after = new Map(screen.elements.map(e => [e.id, e]));
    for (const [id, e] of after) {
      const old = before.get(id);
      if (!old) {
        changes.push({ screen: screen.id, element: id, change: "added", now: pickVisible(e) });
        continue;
      }
      const diff = diffElement(old, e);
      if (diff) {
        changes.push({ screen: screen.id, element: id, change: "edited", fields: diff });
      }
    }
    for (const id of before.keys()) {
      if (!after.has(id)) {
        changes.push({ screen: screen.id, element: id, change: "removed" });
      }
    }
  }
  return changes;
}

function pickVisible(e) {
  const { id, type, x, y, w, h, text, fg, bg, touch, action, value, fontScale } = e;
  return { id, type, x, y, w, h, text, fg, bg, touch, action, value, fontScale };
}

function diffElement(old, now) {
  const keys = ["type", "x", "y", "w", "h", "text", "fg", "bg", "touch", "action", "value", "fontScale", "notes"];
  const out = {};
  for (const key of keys) {
    const a = old[key] ?? null;
    const b = now[key] ?? null;
    if (JSON.stringify(a) !== JSON.stringify(b)) {
      out[key] = { was: a, now: b };
    }
  }
  return Object.keys(out).length ? out : null;
}

function buildExport() {
  const screens = design.screens.map(s => {
    const copy = JSON.parse(JSON.stringify(s));
    copy.hasBackgroundImage = !!s.bg;
    delete copy.bg;
    copy.pins = s.pins.map((p, i) => Object.assign({ number: i + 1 }, p));
    return copy;
  });
  return {
    kind: "gdx-bottom-screen-design",
    version: 1,
    exportedAt: new Date().toISOString(),
    seedSource: seed.source || "",
    screen: { w: SCREEN_W, h: SCREEN_H, cell: CELL },
    openNotes: design.screens.reduce((n, s) => n + s.pins.filter(p => p.status !== "done").length, 0),
    changes: summarizeChanges(),
    screens
  };
}

function exportDesign() {
  const data = buildExport();
  const text = JSON.stringify(data, null, 2);
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
  downloadBlob(new Blob([text], { type: "application/json" }), `bottom-design-${stamp}.json`);
  try {
    navigator.clipboard.writeText(text);
  } catch (err) {
    // clipboard is a convenience only
  }
  toast("Saved to Downloads — tell Claude it’s there");
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function importDesign(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!Array.isArray(parsed.screens)) {
        throw new Error("no screens");
      }
      pushUndo();
      parsed.screens.forEach(s => {
        normalizeScreen(s);
        s.pins.forEach(p => { delete p.number; });
        delete s.hasBackgroundImage;
      });
      design = { version: 1, seedSource: parsed.seedSource || "", screens: parsed.screens };
      currentScreenIndex = 0;
      selectedElementId = null;
      selectedPinId = null;
      commit();
      toast("Design loaded");
    } catch (err) {
      toast("That file isn’t a design JSON");
    }
  };
  reader.readAsText(file);
}

function setBackground(file) {
  const reader = new FileReader();
  reader.onload = () => {
    pushUndo();
    currentScreen().bg = reader.result;
    commit();
  };
  reader.readAsDataURL(file);
}

function exportPng() {
  const scale = 3;
  const canvas = document.createElement("canvas");
  canvas.width = SCREEN_W * scale;
  canvas.height = SCREEN_H * scale;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.scale(scale, scale);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  const screen = currentScreen();
  const finish = () => {
    drawElementsToCanvas(ctx, screen.elements);
    drawPinsToCanvas(ctx, screen.pins);
    canvas.toBlob(blob => downloadBlob(blob, `bottom-${screen.id}.png`));
  };
  if (screen.bg) {
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0, SCREEN_W, SCREEN_H); finish(); };
    img.src = screen.bg;
  } else {
    finish();
  }
}

function drawElementsToCanvas(ctx, elements) {
  for (const e of elements) {
    if (e.bg) {
      ctx.fillStyle = e.bg;
      ctx.fillRect(e.x, e.y, e.w, e.h);
    }
    ctx.strokeStyle = e.fg || "#fff";
    ctx.fillStyle = e.fg || "#fff";
    if (e.type === "box" || e.type === "button" || e.type === "icon") {
      ctx.strokeRect(e.x + 0.5, e.y + 0.5, e.w - 1, e.h - 1);
    }
    if (e.type === "bar") {
      ctx.fillRect(e.x, e.y, e.w * clamp(e.value ?? 60, 0, 100) / 100, e.h);
      continue;
    }
    const size = 8 * (e.fontScale || 1);
    ctx.font = `${size}px "Press Start 2P", monospace`;
    ctx.textBaseline = "top";
    const lines = String(e.text || "").split("\n");
    lines.forEach((line, i) => {
      let tx = e.x;
      let ty = e.y + i * size;
      if (e.type === "button" || e.type === "icon") {
        tx = e.x + (e.w - ctx.measureText(line).width) / 2;
        ty = e.y + (e.h - size) / 2;
      }
      ctx.fillText(line, tx, ty);
    });
  }
}

function drawPinsToCanvas(ctx, pins) {
  pins.forEach((p, i) => {
    ctx.fillStyle = p.status === "done" ? "#48c774" : "#ffb400";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#000";
    ctx.font = "bold 6px sans-serif";
    ctx.fillText(String(i + 1), p.x - 2, p.y - 3);
  });
}

function resetDesign() {
  if (!confirm("Throw away all edits and notes, and reload the in-game layout? (Save for Claude first if you want to keep them.)")) {
    return;
  }
  pushUndo();
  design = cloneDesignFromSeed();
  currentScreenIndex = 0;
  selectedElementId = null;
  selectedPinId = null;
  commit();
}

// ---------- chrome ----------

function setStatus(text) {
  document.getElementById("statusbar").textContent = text;
}

let toastTimer = null;
function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

function toggleButton(id, getter, setter) {
  const button = document.getElementById(id);
  button.classList.toggle("on", getter());
  button.onclick = () => {
    setter(!getter());
    button.classList.toggle("on", getter());
    renderStage();
  };
}

function isTyping(ev) {
  const tag = ev.target.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
}

function onKeyDown(ev) {
  const cmd = ev.metaKey || ev.ctrlKey;
  if (cmd && ev.key.toLowerCase() === "z" && !isTyping(ev)) {
    ev.preventDefault();
    undo();
    return;
  }
  if (isTyping(ev)) {
    return;
  }
  if (cmd && ev.key.toLowerCase() === "d") {
    ev.preventDefault();
    duplicateSelected();
    return;
  }
  if (cmd && ev.key.toLowerCase() === "s") {
    ev.preventDefault();
    exportDesign();
    return;
  }
  const step = ev.shiftKey ? CELL : 1;
  const arrows = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (arrows[ev.key] && selectedElementId) {
    ev.preventDefault();
    nudgeSelected(arrows[ev.key][0], arrows[ev.key][1], ev.altKey);
  } else if (ev.key === "Delete" || ev.key === "Backspace") {
    ev.preventDefault();
    deleteSelected();
  } else if (ev.key === "Escape") {
    selectedElementId = null;
    selectedPinId = null;
    setMode("select");
    renderAll();
  } else if (ev.key.toLowerCase() === "n") {
    setMode("note");
  } else if (ev.key.toLowerCase() === "v") {
    setMode("select");
  }
}

function wireUi() {
  document.getElementById("stage").addEventListener("pointerdown", onStagePointerDown);
  document.getElementById("btnSelectMode").onclick = () => setMode("select");
  document.getElementById("btnNoteMode").onclick = () => setMode(mode === "note" ? "select" : "note");
  document.getElementById("zoom").onchange = ev => { zoomFit = ev.target.value === "fit"; applyZoom(); };
  window.addEventListener("resize", () => { if (zoomFit) { applyZoom(); } });
  toggleButton("btnGrid", () => showGrid, v => { showGrid = v; });
  toggleButton("btnSnap", () => snapToCells, v => { snapToCells = v; });
  toggleButton("btnGhost", () => showGhost, v => { showGhost = v; });
  toggleButton("btnTouch", () => showTouch, v => { showTouch = v; });
  document.getElementById("btnUndo").onclick = undo;
  document.getElementById("btnExport").onclick = exportDesign;
  document.getElementById("btnPng").onclick = exportPng;
  document.getElementById("btnReset").onclick = resetDesign;
  document.getElementById("btnImport").onclick = () => document.getElementById("fileImport").click();
  document.getElementById("fileImport").onchange = ev => { if (ev.target.files[0]) { importDesign(ev.target.files[0]); } ev.target.value = ""; };
  document.getElementById("btnBg").onclick = () => document.getElementById("fileBg").click();
  document.getElementById("fileBg").onchange = ev => { if (ev.target.files[0]) { setBackground(ev.target.files[0]); } ev.target.value = ""; };
  document.getElementById("btnBgClear").onclick = () => { pushUndo(); currentScreen().bg = null; commit(); };
  document.getElementById("btnAddScreen").onclick = addScreen;
  document.getElementById("btnDupScreen").onclick = duplicateScreen;
  document.getElementById("btnDelScreen").onclick = deleteScreen;
  document.querySelectorAll("[data-add]").forEach(b => { b.onclick = () => addElement(b.dataset.add); });
  window.addEventListener("keydown", onKeyDown);
  const wrap = document.getElementById("stageWrap");
  wrap.addEventListener("dragover", ev => ev.preventDefault());
  wrap.addEventListener("drop", ev => {
    ev.preventDefault();
    const file = ev.dataTransfer.files[0];
    if (!file) {
      return;
    }
    if (file.type.startsWith("image/")) {
      setBackground(file);
    } else {
      importDesign(file);
    }
  });
}

function fitZoom() {
  const wrap = document.getElementById("stageWrap");
  const availableW = wrap.clientWidth - 48 - 28;
  const availableH = wrap.clientHeight - 48 - 28 - 60;
  const best = Math.min(availableW / SCREEN_W, availableH / SCREEN_H);
  return Math.max(1, Math.floor(best * 2) / 2);
}

function applyZoom() {
  zoom = zoomFit ? fitZoom() : Number(document.getElementById("zoom").value);
  renderStage();
}

function selectScreenFromHash() {
  const wanted = decodeURIComponent(location.hash.slice(1));
  const index = design.screens.findIndex(screen => screen.id === wanted);
  if (index >= 0) {
    currentScreenIndex = index;
  }
}

wireUi();
selectScreenFromHash();
renderAll();
applyZoom();
if (document.fonts) {
  document.fonts.ready.then(renderStage);
}
</script>
</body>
